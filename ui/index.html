<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="RAGBench: the same retrieval, five ways to write the answer, scored claim by claim."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>RAGBench</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Only the theme is stored.
      try {
        var t = localStorage.getItem("ragbench-theme");
        if (t !== "dark") t = "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
