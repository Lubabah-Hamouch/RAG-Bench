  question: What are the parametric and non-parametric memory components of the RAG model?
  reason: Same paper as kept Q02; its top-4 mixes in Self-RAG chunks; its content is covered by kept multi-hop
    Q09/Q12.
- id: Q04
  type: lookup
  question: Why does Self-RAG retrieve on demand instead of always retrieving a fixed number of passages?
  reason: Same paper as kept Q03; top-4 mixes in Lewis chunks and shares a chunk with Q09; it is the core
    of multi-hop Q09.
- id: Q07
  type: lookup
  question: What is Weaviate?
  reason: Most definitional question over a 6-page document with essentially one gold fact, so coverage
    would be binary and uninformative.
